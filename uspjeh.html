@font-face{
  font-family:'Inter';
  src:url("web-assets/fonts/Inter-Var.woff2") format('woff2');
  font-weight:100 900;
  font-style:normal;
  font-display:swap;
}
:root{
  --ink:#161A1F; --paper:#EFEBE2; --blue:#004085; --copper:#BF633D;
  --ink-64:rgba(22,26,31,.64); --ink-16:rgba(22,26,31,.16);
  --font:'Inter','Helvetica Neue',Helvetica,Arial,sans-serif;
}
html{font-size:16px;-webkit-text-size-adjust:100%}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font);
  min-height:100vh;display:flex;flex-direction:column;
  -webkit-font-smoothing:antialiased;letter-spacing:-.016em}
a{color:inherit}
header{padding:1.6rem 5rem}
header svg{height:1.3rem;width:auto;display:block}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:3rem 1.4rem;text-align:center}
.wrap{max-width:34rem}
h1{font-size:clamp(2.2rem,5vw,3.2rem);font-weight:600;letter-spacing:-.03em;margin-bottom:1.1rem}
p{font-size:1.05rem;line-height:1.65;color:var(--ink-64);margin-bottom:2rem}
.back{display:inline-flex;align-items:center;gap:.6rem;font-size:.938rem;color:var(--ink);
  border-bottom:1px solid var(--ink-16);padding-bottom:.2rem;text-decoration:none;transition:.3s}
.back:hover{color:var(--blue);border-color:var(--blue)}
@media(max-width:640px){header{padding:1.4rem 1.4rem}}
